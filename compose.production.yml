name: crisispulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-maintenance-build: &maintenance-build
  context: .
  dockerfile: Dockerfile.maintenance

services:
  init-volumes:
    image: alpine:3.23
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    command:
      - /bin/sh
      - -c
      - >-
        touch /state/refresh-status.lock &&
        chown -R 10001:10001 /state /work /caddy-data /caddy-config &&
        chown 10001:10001 /backups &&
        if [ -e /backups/backup.lock ]; then chown 10001:10001 /backups/backup.lock; fi &&
        chmod 0644 /state/refresh-status.lock &&
        chmod 0755 /backups
    volumes:
      - crisis_state:/state
      - crisis_work:/work
      - caddy_data:/caddy-data
      - caddy_config:/caddy-config
      - ./backups:/backups

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      CRISISPULSE_SITE_ADDRESS: ${CRISISPULSE_SITE_ADDRESS:-http://localhost}
      CRISISPULSE_ADMIN_USER: ${CRISISPULSE_ADMIN_USER:-admin}
      CRISISPULSE_ADMIN_PASSWORD_HASH: ${CRISISPULSE_ADMIN_PASSWORD_HASH:?set a Caddy password hash in .env.production}
    ports:
      - "${CRISISPULSE_HTTP_PORT:-8088}:80"
      - "${CRISISPULSE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy

  local-preview:
    image: caddy:2.10-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "127.0.0.1:${CRISISPULSE_LOCAL_PREVIEW_PORT:-3000}:80"
    volumes:
      - ./production/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    command:
      - --addr
      - 0.0.0.0:8080
      - --data
      - /var/lib/crisispulse/dashboard.json
      - --reviews
      - /var/lib/crisispulse/reviews.jsonl
      - --backup-status
      - /var/lib/crisispulse-backups/backup-status.json
      - --allowed-origin
      - ${CRISISPULSE_PUBLIC_ORIGIN:-http://localhost:8088},${CRISISPULSE_LOCAL_PREVIEW_ORIGIN:-http://localhost:3000}
    volumes:
      - crisis_state:/var/lib/crisispulse
      - ./backups:/var/lib/crisispulse-backups:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    logging: *default-logging
    environment:
      CRISISPULSE_ALERT_WEBHOOK_URL: ${CRISISPULSE_ALERT_WEBHOOK_URL:-}
      CRISISPULSE_MONITOR_INTERVAL_SECONDS: ${CRISISPULSE_MONITOR_INTERVAL_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy

  refresh:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: Dockerfile.refresh
    # Keep refresh work responsive alongside the desktop app. This is a hard
    # container CPU ceiling; --workers remains the pipeline concurrency knob.
    cpus: "${CRISISPULSE_REFRESH_CPUS:-8.0}"
    command:
      - --raw-dir
      - /var/lib/crisispulse/raw
      - --work-dir
      - /app/data
      - --dashboard-output
      - /var/lib/crisispulse/dashboard.json
      - --status-path
      - /var/lib/crisispulse/refresh-status.json
      - --window-intervals
      - ${CRISISPULSE_WINDOW_INTERVALS:-8}
      - --retention-bytes
      - ${CRISISPULSE_RETENTION_BYTES:-10000000000}
      - --workers
      - ${CRISISPULSE_REFRESH_WORKERS:-8}
      - --title-backfill-batch
      - ${CRISISPULSE_TITLE_BACKFILL_BATCH:-12}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - crisis_state:/var/lib/crisispulse
      - crisis_work:/app/data
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  backup:
    profiles: ["maintenance"]
    build: *maintenance-build
    image: crisispulse-maintenance:local
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    environment:
      CRISISPULSE_BACKUP_RETENTION_DAYS: ${CRISISPULSE_BACKUP_RETENTION_DAYS:-14}
    command: ["/bin/sh", "/opt/crisispulse/backup.sh"]
    volumes:
      - crisis_state:/state:ro
      - crisis_work:/work:ro
      - ./backups:/backups
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  restore:
    profiles: ["maintenance"]
    build: *maintenance-build
    image: crisispulse-maintenance:local
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    environment:
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-NO}
      RESTORE_ARCHIVE: ${RESTORE_ARCHIVE:-}
    command: ["/bin/sh", "/opt/crisispulse/restore.sh"]
    volumes:
      - crisis_state:/state
      - crisis_work:/work
      - ./backups:/backups:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully

volumes:
  crisis_state:
    name: ${CRISISPULSE_STATE_VOLUME:-crisispulse_crisis_state}
  crisis_work:
    name: ${CRISISPULSE_WORK_VOLUME:-crisispulse_crisis_work}
  caddy_data:
  caddy_config:
